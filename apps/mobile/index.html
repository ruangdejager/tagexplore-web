<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the app draw under the Dynamic Island and home
         bar; the CSS then pads with env(safe-area-inset-*) itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12140f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Farmranger Tags" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/m/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/m/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/m/farmranger-logo.svg" />
    <title>Farmranger Tags</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // A bundle that failed to load (a deploy landing mid-load, a dropped
      // connection) leaves #root empty for good. Reload once if nothing has
      // been drawn after 20s; main.tsx clears the flag once the app is running.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.hasChildNodes()) return;
        try {
          if (sessionStorage.getItem('tx-boot-retry')) return;
          sessionStorage.setItem('tx-boot-retry', '1');
        } catch (e) {
          return;
        }
        location.reload();
      }, 20000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
